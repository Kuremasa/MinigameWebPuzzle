<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>回転パズル</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">CHAIN</span>
        <span id="chain">0</span>
      </div>
    </header>

    <main id="board-wrap">
      <canvas id="game-canvas" width="480" height="480"></canvas>
      <div id="overlay" class="hidden">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button type="button" id="btn-restart">もう一度</button>
      </div>
    </main>

    <footer id="controls">
      <button type="button" id="btn-rotate-left" class="ctrl-btn" aria-label="左回転">↺</button>
      <button type="button" id="btn-drop" class="ctrl-btn ctrl-drop" aria-label="高速落下">↓</button>
      <button type="button" id="btn-rotate-right" class="ctrl-btn" aria-label="右回転">↻</button>
    </footer>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/board.js"></script>
  <script src="js/piece.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
